name: post-release

on:
  workflow_call:
    inputs:
      develop-branch:
        type: string
        default: develop

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version from merged release branch
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[].head.ref' | grep -E '^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$BRANCH" ]; then
            echo "No release/* or hotfix/* PR for this commit; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=${BRANCH##*/}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Open PR to sync main into develop
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE="${{ inputs.develop-branch }}"
          VERSION="${{ steps.version.outputs.version }}"
          SYNC="sync/main-to-${BASE}-${VERSION}"

          if [ -z "$(git rev-list "origin/${BASE}..origin/main")" ]; then
            echo "No changes to sync into ${BASE}; skipping PR."
            exit 0
          fi
          if [ -n "$(gh pr list --base "$BASE" --head "$SYNC" --state open --json number --jq '.[].number')" ]; then
            echo "Sync PR ${SYNC} already open; skipping."
            exit 0
          fi

          git push origin "origin/main:refs/heads/${SYNC}"
          gh pr create --base "$BASE" --head "$SYNC" \
            --title "chore: sync ${BASE} with main after ${VERSION}" \
            --body "Merge \`main\` into \`${BASE}\` after release ${VERSION}. If GitHub reports conflicts, resolve them on \`${SYNC}\` (e.g. \`git merge origin/${BASE}\`) before merging."

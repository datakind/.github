name: Require and link Asana task

on:
  workflow_call:
    secrets:
      ASANA_SECRET:
        required: true

jobs:
  asana:
    runs-on: ubuntu-latest
    name: Require and link Asana task
    steps:
      - id: gate
        env:
          HEAD: ${{ github.head_ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$ACTOR" == *"[bot]" ]] || \
             [[ "$HEAD" == release-please--* ]] || \
             [[ "$HEAD" == sync/* ]] || \
             [[ "$HEAD" == chore/sync-* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping Asana for packaging/sync PR ($ACTOR / $HEAD)"
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const urlPattern = /https:\/\/app\.asana\.com\/(?:0\/(?:0|[0-9]+)\/(?:task\/)?([0-9]+)|1\/[0-9]+\/project\/[0-9]+\/task\/([0-9]+))/i;
            if (!body.match(urlPattern)) {
              core.setFailed("PR description must include an Asana task URL.");
            }

      - if: steps.gate.outputs.skip != 'true'
        uses: Asana/create-app-attachment-github-action@v1.3
        with:
          asana-secret: ${{ secrets.ASANA_SECRET }}

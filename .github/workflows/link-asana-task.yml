name: Require and link Asana task

on:
  workflow_call:
    secrets:
      ASANA_SECRET:
        required: true

jobs:
  asana:
    runs-on: ubuntu-latest
    name: Require and link Asana task
    steps:
      - uses: actions/github-script@v7
        env:
          ASANA_SECRET: ${{ secrets.ASANA_SECRET }}
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const urlPattern = /https:\/\/app\.asana\.com\/(?:0\/(?:0|[0-9]+)\/(?:task\/)?([0-9]+)|1\/[0-9]+\/project\/[0-9]+\/task\/([0-9]+))/i;
            const match = body.match(urlPattern);
            if (!match) {
              core.setFailed("PR description must include an Asana task URL.");
              return;
            }

            const taskGid = match[1] || match[2];
            const pr = context.payload.pull_request;
            const payload = {
              data: {
                resource_subtype: "external",
                parent: taskGid,
                url: pr.html_url,
                name: `PR #${pr.number}: ${pr.title}`,
              },
            };

            const response = await fetch("https://app.asana.com/api/1.0/attachments", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.ASANA_SECRET}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });
            if (!response.ok) {
              core.setFailed(`Asana API failed: ${response.status} ${await response.text()}`);
              return;
            }
            core.info(`Linked PR to Asana task ${taskGid}`);
